x-app: &app
  build:
    context: .
    dockerfile: infra/Dockerfile
  env_file: .env
  environment:
    DATABASE_URL: postgresql://ugn:ugn@postgres:5432/ugn
    REDIS_HOST: redis
    S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
    S3_BROWSER_ENDPOINT: ${S3_BROWSER_ENDPOINT:-http://localhost:9000}
    S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000/media}
    S3_REGION: ${S3_REGION:-us-east-1}
    S3_BUCKET: ${S3_BUCKET:-media}
    S3_FORCE_PATH_STYLE: "true"
    UPLOAD_IDLE_DAYS: ${UPLOAD_IDLE_DAYS:-7}
    FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ugnlocal}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-local-development-only-password}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    storage-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ugn
      POSTGRES_PASSWORD: ugn
      POSTGRES_DB: ugn
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ugn"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  localstack:
    profiles: [legacy]
    image: localstack/localstack:4.0.3
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "127.0.0.1:4566:4566"
    healthcheck:
      test:
        - CMD-SHELL
        - awslocal s3api list-buckets >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  minio:
    image: ugn-minio:local
    build:
      context: ./infra
      dockerfile: Minio.Dockerfile
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-ugnlocal}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-local-development-only-password}
      MINIO_API_STALE_UPLOADS_EXPIRY: 2160h
      MINIO_API_CORS_ALLOW_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    ports:
      - "9000:9000"
    volumes:
      - mediadata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  storage-init:
    <<: *app
    depends_on:
      minio:
        condition: service_healthy
    command: npx tsx infra/init-storage.ts

  backend:
    <<: *app
    command: sh -c "npx prisma db push --schema apps/backend/prisma/schema.prisma && npm start -w @ugn/backend"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  worker:
    <<: *app
    command: npm start -w @ugn/worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ugn:ugn@postgres:5432/ugn
      REDIS_HOST: redis
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ugnlocal}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-local-development-only-password}
      WORKER_TMP_ROOT: /work
      WORKER_MAX_SCRATCH_GIB: ${WORKER_MAX_SCRATCH_GIB:-100}
    volumes:
      - workerscratch:/work
    init: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  frontend:
    <<: *app
    command: npm start -w @ugn/frontend
    ports:
      - "5173:5173"

volumes:
  pgdata:
  redisdata:
  mediadata:
  workerscratch:
