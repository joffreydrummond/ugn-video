x-app: &app
  build:
    context: .
    dockerfile: infra/Dockerfile
  env_file: .env
  environment:
    DATABASE_URL: postgresql://ugn:ugn@postgres:5432/ugn
    REDIS_HOST: redis
    S3_ENDPOINT: http://localstack:4566
    S3_BROWSER_ENDPOINT: http://localhost:4566
    S3_PUBLIC_URL: http://localhost:4566/media
    S3_REGION: us-east-1
    S3_BUCKET: media
    S3_FORCE_PATH_STYLE: "true"
    S3_ACCESS_KEY: test
    S3_SECRET_KEY: test
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    storage-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ugn
      POSTGRES_PASSWORD: ugn
      POSTGRES_DB: ugn
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ugn"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:4.0.3
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "127.0.0.1:4566:4566"
    healthcheck:
      test:
        - CMD-SHELL
        - awslocal s3api list-buckets >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  storage-init:
    image: localstack/localstack:4.0.3
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        aws --endpoint-url=http://localstack:4566 s3api head-bucket --bucket media 2>/dev/null ||
          aws --endpoint-url=http://localstack:4566 s3api create-bucket --bucket media

        cat > /tmp/cors.json <<'JSON'
        {
          "CORSRules": [
            {
              "AllowedOrigins": ["http://localhost:5173"],
              "AllowedMethods": ["GET", "HEAD", "PUT", "POST", "DELETE"],
              "AllowedHeaders": ["*"],
              "ExposeHeaders": ["ETag", "Content-Length", "Content-Range"],
              "MaxAgeSeconds": 3600
            }
          ]
        }
        JSON

        aws --endpoint-url=http://localstack:4566 s3api put-bucket-cors \
          --bucket media \
          --cors-configuration file:///tmp/cors.json

        cat > /tmp/policy.json <<'JSON'
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": "*",
              "Action": "s3:GetObject",
              "Resource": "arn:aws:s3:::media/videos/*"
            }
          ]
        }
        JSON

        aws --endpoint-url=http://localstack:4566 s3api put-bucket-policy \
          --bucket media \
          --policy file:///tmp/policy.json

        echo "Video storage initialized."

  backend:
    <<: *app
    command: sh -c "npx prisma db push --schema apps/backend/prisma/schema.prisma && npm start -w @ugn/backend"
    ports:
      - "3000:3000"

  worker:
    <<: *app
    command: npm start -w @ugn/worker
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  frontend:
    <<: *app
    command: npm start -w @ugn/frontend
    ports:
      - "5173:5173"

volumes:
  pgdata:
  redisdata: